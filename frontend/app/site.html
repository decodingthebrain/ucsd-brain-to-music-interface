<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain DJ Interface: Remixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Include Styling here
        format:*/

        body {
            font-family: 'Oswald', sans-serif;
            background: linear-gradient(135deg, #8985ff, #25244d);
            background-size: 100% 100%;
            /* adjusts height to make the gradient stretch and transition smoothly*/
            background-repeat: no-repeat;
            /*makes sure it doesn't repeat*/
            min-height: 100vh;
            /*ensures body is at least viewport height*/
            /*
            margin
            padding
            line-height
            scroll-height
            */
        }

        .title {
            color: black;
            font-size: 44px;
            font-weight: 700;
            /* test using : npx live-server . --port=8080 and view it here: http://localhost:8080/frontend/app/site.html */
        }

        .subtitle {
            color: black;
            font-size: 34px;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <header class="text-center m-12">
            <h1 class="title">Brain DJ Interface: Remixed</h1>
            <h2 class="subtitle">Produced by Decoded Brain at UC San Diego</h2>
        </header>

        <div class="text-center flex-container m-32">
            <button
                class="bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-lg transition hover:scale-105 py-3 px-6">
                Start your Stream...
            </button>
        </div>

        <div class="text-center m-8">
            <h1 class="title">
                Your Stream has Started
            </h1>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-2 gap-6">
            <div class="bg-gray-100 p-4 rounded">Song 1</div>
            <div class="bg-gray-100 p-4 rounded">Song 2</div>
            <div class="bg-gray-100 p-4 rounded">Song 3</div>
            <div class="bg-gray-100 p-4 rounded">Song 4</div>
            <div class="bg-gray-100 p-4 rounded">Song 5</div>
            <div class="bg-gray-100 p-4 rounded">Song 6</div>

        </div>
    </div>











    <script>

    </script>
</body>

</html>
