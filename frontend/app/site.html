<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain DJ Interface: Remixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Include Styling here
        format:*/

        body {
            font-family: 'Oswald', sans-serif;
            background: linear-gradient(167deg, #8985ff, #25244d);
            background-size: 100% 100%;
            /* adjusts height to make the gradient stretch and transition smoothly*/
            background-repeat: no-repeat;
            /*makes sure it doesn't repeat*/
            min-height: 100vh;
            /*ensures body is at least viewport height*/
            /*
            margin
            padding
            line-height
            scroll-height
            */
        }

        .title {
            color: black;
            font-size: 44px;
            font-weight: 700;
            /* test using : npx live-server . --port=8080 and view it here: http://localhost:8080/frontend/app/site.html */
        }

        .subtitle {
            color: black;
            font-size: 34px;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <header class="text-center m-12">
            <h1 class="title">Brain DJ Interface: Remixed</h1>
            <h2 class="subtitle">Produced by Decoded Brain at UC San Diego</h2>
        </header>

        <div class="text-center flex-container m-32">
            <button id="start-button-control"
                class="bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-lg transition hover:scale-105 py-3 px-6">
                Start your Stream...
            </button>
        </div>

        <div class="text-center m-8">
            <h1 class="title" id="status-title">
                Status
            </h1>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-2 gap-6" id="song-list">
            <div class="bg-gray-100 p-4 rounded">Song 1</div>
            <div class="bg-gray-100 p-4 rounded">Song 2</div>
            <div class="bg-gray-100 p-4 rounded">Song 3</div>
            <div class="bg-gray-100 p-4 rounded">Song 4</div>
            <div class="bg-gray-100 p-4 rounded">Song 5</div>
            <div class="bg-gray-100 p-4 rounded">Song 6</div>

        </div>
    </div>











    <script>
        const API_BASE = 'http://localhost:5005';
        let pollingInterval = null;

        // implement start and stop controller using api endpoints
        const btnControl = document.getElementById('start-button-control');
        btnControl.addEventListener('click', async () => {
            // check current state 
            const isRunning = btnControl.dataset.running == 'true';

            try {
                if (!isRunning) {
                    // if not running, then start
                    const res = await fetch(`${API_BASE}/api/start`, { method: 'POST' });
                    const data = await res.json();
                    updateUI(data);
                } else {
                    // if running, then stop
                    const res = await fetch(`${API_BASE}/api/stop`, { method: 'POST' });
                    const data = await res.json();
                    updateUI(data);
                }
            } catch (err) {
                console.error("Failed to execute control:", err);
            }

        });


        // recently played songs
        function updateHistoryList(songs) {
            const listContainer = document.getElementById('song-list');
            listContainer.innerHTML = ''; // clear old songs


            if (songs && songs.length > 0) {
                songs.forEach((song) => {
                    const card = document.createElement('div');
                    card.className = "bg-gray-100 p-4 rounded shadow-sm text-black";
                    card.textContent = song;
                    listContainer.appendChild(card);
                });
            } else {
                listContainer.innerHTML = '<div class="col-span-2 text-gray-400">No songs suggested yet.</div>';
            }
        }


        //updateUI function to update the web page with the state
        function updateUI(state) {
            const statusTitle = document.getElementById('status-title');

            // track run status on button dataset
            btnControl.dataset.running = (state.status === 'running' || state.status === 'initializing');

            // iterate through different statuses
            switch (state.status) {
                case 'stopped':
                    btnControl.textContent = "Start Stream";
                    statusTitle.textContent = "Your Stream is Offline";
                    break;
                case 'initializing':
                    btnControl.textContent = "Stop Stream";
                    statusTitle.textContent = "Initializing Playlist on Spotify...";
                    break;
                case 'running':
                    btnControl.textContent = "Stop Stream";
                    // if currently playing song exists, display it
                    // if not just say stream has started
                    statusTitle.textContent = state.current_song
                        ? `Playing: ${state.current_song}`
                        : "Your Stream has Started";
                    break;
            }

            // update recently played list
            updateHistoryList(state.recently_played);
        }

        // create polling loop /api/status
        // function that that polls server's state periodically
        async function pollStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/status`);
                if (res.ok) {
                    const state = await res.json();
                    updateUI(state);
                }
            } catch (err) {
                console.warn("Server is offline:", err);
                // to implement, a badge that shows "Disconnected "
            }
        }

        pollStatus();
        setInterval(pollStatus, 1000) // every 1000ms or 1 second




    </script>
</body>

</html>
